# DockPilot · proxy inverso del frontend
#
# Su trabajo es que el SPA y la API parezcan el mismo servidor. El cliente lo da
# por hecho —`BASE_URL` es relativo y `wsUrl()` sale de `window.location`—, así
# que si estas reglas faltaran, el panel cargaría y cada botón daría un 404 sin
# explicación.

# La cabecera `Connection` no vale una constante. El protocolo pide `upgrade`
# sólo cuando la petición trae `Upgrade`, y mandar `Connection: upgrade` en una
# petición normal rompe el keep-alive. Esta `map` es el idioma estándar del
# asunto y va en contexto `http`, que es donde la incluye `conf.d`.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # `resolver 127.0.0.11` es el DNS embebido de Docker, y `valid=10s` lo que
    # obliga a resolver en cada request en vez de cachear la IP.
    #
    # Sin esto, nginx resuelve `backend` al arrancar, se guarda la IP en memoria
    # y se la queda para siempre. El backend se reinicia, docker le da otra IP,
    # y el proxy sigue hablando con la vieja: 502 para siempre, sin que nada haya
    # parecido romperse. Usar una variable en `proxy_pass` es lo que hace que la
    # resolución pase a ser por request, que es justo lo que quiere Docker.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Cifrado y compresión. `types` se declara vacío a propósito: la imagen base
    # trae su propio mapa y redefinirlo aquí pondría `default_type
    # application/octet-stream` en todo, con los `.js` y `.css` servidos sin
    # tipo, que es como algunos navegadores los descartan.
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml application/manifest+json;

    # ---- El SPA -----------------------------------------------------------
    #
    # `try_files ... /index.html` aunque hoy no haya router —las pestañas son
    # estado, no rutas—. Es una red de seguridad: sin ella, un `index.html`
    # recién construido con un nombre distinto, o cualquier ruta profunda que se
    # añada en el futuro, devuelve 404 con un panel que funciona perfectamente.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite emite los assets con el hash del contenido en el nombre, así que el
    # contenido de un nombre dado NO cambia nunca. Cachearlos un año es correcto
    # y es la razón de que el build se note en la segunda visita.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # `index.html` es justo al revés: lleva los hashes de los assets, así que
    # cachearlo es justo la forma de quedarse con una versión que ya no existe.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # ---- La API -----------------------------------------------------------
    location /api/ {
        set $backend http://backend:8181;
        proxy_pass $backend$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Los WebSocket ----------------------------------------------------
    #
    # `/ws` sin barra final a propósito: los canales son `/ws/containers/{id}/stats`,
    # `/ws/images/pull` y `/ws/compose/{action}`, y con barra final `location`
    # dejaría de casar con rutas más profundas.
    location /ws {
        set $backend_ws http://backend:8181;
        proxy_pass $backend_ws$request_uri;

        # Un WebSocket es un `Upgrade: websocket` sobre HTTP/1.1, y sin el
        # `Connection` correspondiente el daemon responde 400 y el navegador
        # avisa de que no puede establecer la conexión. Es el mismo punto por el
        # que pasan los errores que se ven en la consola del frontend.
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Plazos largos porque los canales se quedan quietos a propósito: el de
        # compose en `logs --follow` puede no emitir nada durante horas. Con el
        # `proxy_read_timeout` de 60 s por defecto, nginx cierra un socket que
        # el backend creía abierto, y el error se vería como un WebSocket que se
        # cae sin motivo aparente.
        #
        # `proxy_buffering off` porque un stream de métricas a 0,5 Hz con
        # búfer de por medio se entrega a ráfagas, y el sparkline y las curvas
        # se verían a saltos en vez de en vivo.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering     off;
    }

    # ---- La documentación de la API ---------------------------------------
    #
    # `/docs` va también por aquí porque la ayuda del panel (SPEC-00, el modal de
    # ayuda) manda abrirla en el puerto del FRONTEND, no en el del backend. Sin
    # estas reglas, seguir esas instrucciones daría el 404 del SPA.
    location ~ ^/(docs|openapi\.json|redoc)$ {
        set $backend_docs http://backend:8181;
        proxy_pass $backend_docs$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Las rutas que no son del SPA ni del backend se responden con un 404
    # explícito en vez de caer en `/index.html`. El `try_files` de arriba devuelve
    # el panel para lo que parece una ruta de aplicación, que es lo que se
    # quiere; esto es solo para dejar claro que no hay más superficie.
    location = /favicon.ico {
        access_log off;
    }
}